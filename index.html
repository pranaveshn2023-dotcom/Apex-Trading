<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Apex Trading • Real-Time Paper Trading & Market Terminal</title>
    <meta name="description" content="Professional virtual paper trading terminal for Indian Equities, Global Stocks, and Benchmark Indices with 100% real live market data." />

    <!-- Universal Mobile Web App & PWA Architecture (Android, iOS, Samsung, Windows, Chrome) -->
    <link rel="manifest" href="/manifest.json?v=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Apex Trading" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Mobile Navigation & Status Bar Color Schemes -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070a11" />
    <meta name="msapplication-TileColor" content="#059669" />
    <meta name="msapplication-navbutton-color" content="#059669" />
    <meta name="msapplication-starturl" content="/" />

    <!-- Fullscreen Standalone App Capability (All Mobile OS: Android, iOS, HarmonyOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Apex Trading" />

    <!-- Universal Touch & Home Screen Icons for All Mobile Devices -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
    <meta name="msapplication-TileImage" content="/icon-192.png" />

    <!-- Rich Social & Mobile Sharing Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Apex Trading • Real-Time Paper Trading Terminal" />
    <meta property="og:description" content="Universal virtual paper trading terminal for Indian Equities, Global Stocks, and Benchmark Indices." />
    <meta property="og:image" content="/icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              // Check for updates periodically
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('[PWA] New version available. Refresh to update.');
                    }
                  };
                }
              };
            })
            .catch(err => {
              console.warn('[PWA] SW registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
