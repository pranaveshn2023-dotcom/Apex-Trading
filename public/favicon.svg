<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322" />
      <stop offset="50%" stop-color="#060a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="axGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="80%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <g filter="url(#neonGlow)">
    <!-- Letter 'A' -->
    <path d="M 120 375 L 205 135 L 255 135 L 170 375 Z" fill="url(#axGrad)" />
    <path d="M 205 135 L 255 135 L 305 275 L 260 275 Z" fill="url(#axGrad)" opacity="0.95" />
    <path d="M 155 285 L 260 285 L 250 250 L 167 250 Z" fill="#10b981" />
    <polygon points="205,135 255,135 230,105" fill="#67e8f9" />

    <!-- Letter 'X' -->
    <path d="M 285 135 L 335 135 L 435 375 L 385 375 Z" fill="url(#axGrad)" opacity="0.85" />
    <path d="M 265 375 L 390 155 L 440 155 L 315 375 Z" fill="url(#bullGrad)" />
    <polygon points="405,120 455,145 425,185 410,150" fill="#38bdf8" />
  </g>

  <line x1="80" y1="415" x2="432" y2="415" stroke="url(#axGrad)" stroke-width="4" stroke-linecap="round" />
  <circle cx="80" cy="415" r="5" fill="#10b981" />
  <circle cx="432" cy="415" r="4" fill="#38bdf8" />
</svg>