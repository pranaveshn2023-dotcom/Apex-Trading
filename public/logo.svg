<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322" />
      <stop offset="50%" stop-color="#060a12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- AX Primary Neon Gradient (Emerald to Cyan) -->
    <linearGradient id="axGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="35%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Upward Bull Market Arrow Gradient -->
    <linearGradient id="bullGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="centerLight" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.05" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#centerLight)" />

  <!-- The AX Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Letter 'A' -->
    <!-- Left Leg of A -->
    <path d="M 120 375 L 205 135 L 255 135 L 170 375 Z" fill="url(#axGrad)" />

    <!-- Right Leg of A (tucks behind the X) -->
    <path d="M 205 135 L 255 135 L 305 275 L 260 275 Z" fill="url(#axGrad)" opacity="0.95" />

    <!-- Crossbar of A -->
    <path d="M 155 285 L 260 285 L 250 250 L 167 250 Z" fill="#10b981" />

    <!-- Apex Highlight on A -->
    <polygon points="205,135 255,135 230,105" fill="#67e8f9" />

    <!-- Letter 'X' -->
    <!-- Descending Stroke of X -->
    <path d="M 285 135 L 335 135 L 435 375 L 385 375 Z" fill="url(#axGrad)" opacity="0.85" />

    <!-- Ascending Bullish Stroke of X with Growth Arrow Head -->
    <path d="M 265 375 L 390 155 L 440 155 L 315 375 Z" fill="url(#bullGrad)" />

    <!-- Growth Arrow at top right of X -->
    <polygon points="405,120 455,145 425,185 410,150" fill="#38bdf8" />
  </g>

  <!-- High-Tech Grid & Precision Lines -->
  <line x1="80" y1="415" x2="432" y2="415" stroke="url(#axGrad)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <circle cx="80" cy="415" r="4" fill="#10b981" />
  <circle cx="432" cy="415" r="4" fill="#38bdf8" />
  
  <!-- Subtle text underneath for clarity -->
  <text x="256" y="445" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="#94a3b8" letter-spacing="8" text-anchor="middle">APEX</text>
</svg>
